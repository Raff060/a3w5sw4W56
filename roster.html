<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --bg:#0B0B0C;
    --border:#232326;
    --text:#F2F1EE;
    --text-dim:#8C8C91;
    --accent:#7C5CFC;
    --accent-soft:rgba(124,92,252,0.1);

}


body{

    background:var(--bg);
    color:var(--text);
    font-family:Inter,sans-serif;
    overflow-x:hidden;

}


a{
    color:inherit;
}


/* Navigation */


nav{

    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:26px 7%;

    background:var(--bg);

    border-bottom:1px solid var(--border);

}


.logo{

    font-family:Archivo;
    font-size:22px;
    font-weight:800;
    letter-spacing:2px;

    color:var(--text);

}


nav ul{

    display:flex;
    gap:40px;
    list-style:none;

}


nav a{

    color:var(--text-dim);
    text-decoration:none;
    font-size:15px;

    position:relative;

    transition:color .2s;

}


nav a::after{

    content:"";
    position:absolute;
    left:0;
    bottom:-6px;
    width:0;
    height:1px;
    background:var(--accent);
    transition:width .25s ease;

}


nav a:hover{

    color:var(--text);

}


nav a:hover::after{

    width:100%;

}


nav a.active{

    color:var(--text);

}


nav a.active::after{

    width:100%;

}


/* Page header */


.page-head{

    width:86%;
    max-width:1280px;
    margin:70px auto 50px;

}


.eyebrow{

    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--accent);
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:16px;

}


.page-head h1{

    font-family:Archivo;
    font-size:48px;
    font-weight:900;
    letter-spacing:-1px;

}


.page-head p{

    margin-top:16px;
    color:var(--text-dim);
    font-size:15px;
    max-width:480px;
    line-height:1.7;

}


/* Roster grid */


.roster{

    width:86%;
    max-width:1280px;
    margin:0 auto 120px;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;

}


.player-card{

    background:#141416;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;

    transition:border-color .2s;

}


.player-card:hover{

    border-color:var(--accent);

}


.player-photo{

    width:100%;
    aspect-ratio:1/1;

    background:#1B1B1E;

    display:flex;
    align-items:center;
    justify-content:center;

    border-bottom:1px solid var(--border);

}


.player-photo svg{

    width:56px;
    height:56px;
    opacity:0.25;

}


.player-info{

    padding:18px 20px 22px;

}


.player-role{

    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:8px;

}


.player-name{

    font-family:Archivo;
    font-size:17px;
    font-weight:700;
    color:var(--text);
    margin-bottom:4px;

}


.player-handle{

    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--text-dim);

}


/* Mobile */


@media(max-width:900px){

    nav ul{
        display:none;
    }

    .page-head h1{
        font-size:34px;
    }

    .roster{
        grid-template-columns:repeat(2,1fr);
    }

}


@media(max-width:520px){

    .roster{
        grid-template-columns:1fr;
    }

}


</style>


</head>
