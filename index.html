<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glide Esports</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    background:#09090B;
    color:white;
    font-family:Inter,sans-serif;
    overflow-x:hidden;

}


/* Animated Background Glow */

body::before{

    content:"";
    position:fixed;
    inset:-200px;

    background:
    radial-gradient(circle at 20% 20%, #8B5CF655, transparent 35%),
    radial-gradient(circle at 80% 80%, #C084FC33, transparent 40%);

    animation:moveGlow 10s infinite alternate;

    z-index:-2;

}


@keyframes moveGlow{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(80px,-40px);
    }

}



/* Navigation */


nav{

    width:90%;
    margin:25px auto;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px 35px;

    background:#121218aa;

    backdrop-filter:blur(15px);

    border:1px solid #ffffff15;

    border-radius:20px;

}


.logo{

    font-family:Orbitron;
    font-size:30px;
    font-weight:900;

    color:#C084FC;

}


nav ul{

    display:flex;
    gap:35px;
    list-style:none;

}


nav a{

    color:#ddd;
    text-decoration:none;

    transition:.3s;

}


nav a:hover{

    color:#C084FC;

}



/* Hero */


.hero{

    min-height:85vh;

    display:flex;

    align-items:center;

    justify-content:space-between;

    width:85%;

    margin:auto;

    position:relative;

}



/* Giant Background Text */


.background-text{

    position:absolute;

    top:10%;

    left:0;

    font-family:Orbitron;

    font-size:240px;

    font-weight:900;

    color:white;

    opacity:.03;

    z-index:-1;

}




.hero-text{

    max-width:600px;

    animation:fadeIn 1.5s;

}


.hero h1{

    font-family:Orbitron;

    font-size:75px;

    line-height:1;

}


.hero h1 span{

    color:#C084FC;

}



.hero p{

    margin-top:25px;

    color:#A1A1AA;

    font-size:20px;

    line-height:1.6;

}



/* Buttons */


.buttons{

    margin-top:40px;

}


.btn{

    display:inline-block;

    padding:15px 35px;

    border-radius:12px;

    text-decoration:none;

    margin-right:15px;

    transition:.3s;

}


.primary{

    background:#8B5CF6;

    color:white;

}


.primary:hover{

    box-shadow:0 0 30px #8B5CF6;

    transform:translateY(-5px);

}


.secondary{

    border:1px solid #8B5CF6;

    color:white;

}


.secondary:hover{

    background:#8B5CF6;

}




/* Logo */


.logo-area{

    display:flex;

    justify-content:center;

    align-items:center;

}



.logo-placeholder{

    width:320px;

    height:320px;

    border-radius:50%;

    background:#121218;

    border:2px solid #8B5CF6;

    display:flex;

    justify-content:center;

    align-items:center;


    font-family:Orbitron;

    font-size:55px;

    font-weight:900;

    color:#C084FC;


    box-shadow:

    0 0 50px #8B5CF655;


    animation:float 4s infinite ease-in-out;

}



@keyframes float{

    0%,100%{

        transform:translateY(0);

    }

    50%{

        transform:translateY(-25px);

    }

}



/* Scroll */


.scroll{

    position:absolute;

    bottom:40px;

    left:50%;

    transform:translateX(-50%);

    color:#A1A1AA;

    animation:bounce 2s infinite;

}


@keyframes bounce{

    50%{

        transform:translate(-50%,20px);

    }

}



/* Fade */


@keyframes fadeIn{

    from{

        opacity:0;
        transform:translateY(30px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}



/* Mobile */


@media(max-width:900px){


.hero{

    flex-direction:column;

    text-align:center;

}


.hero h1{

    font-size:50px;

}


.logo-placeholder{

    width:220px;

    height:220px;

    margin-top:50px;

}


nav ul{

    display:none;

}


.background-text{

    font-size:120px;

}



}


</style>


</head>


<body>



<nav>

<div class="logo">
GLIDE
</div>


<ul>

<li><a href="index.html">Home</a></li>

<li><a href="pages/roster.html">Roster</a></li>

<li><a href="pages/matches.html">Matches</a></li>

<li><a href="pages/standings.html">Standings</a></li>

<li><a href="pages/news.html">News</a></li>

<li><a href="pages/contact.html">Contact</a></li>

</ul>


</nav>




<section class="hero">


<div class="background-text">
GLIDE
</div>



<div class="hero-text">


<h1>
Glide<br>
<span>Esports</span>
</h1>


<p>

Competitive Counter-Strike 2 organisation.
<br><br>

Building a strong roster, competing in leagues,
tournaments and creating a community around
competitive esports.

</p>



<div class="buttons">

<a class="btn primary" href="pages/roster.html">
View Roster
</a>


<a class="btn secondary" href="pages/matches.html">
Upcoming Match
</a>


</div>


</div>




<div class="logo-area">


<div class="logo-placeholder">

GLIDE

</div>


</div>




<div class="scroll">

↓ Scroll

</div>


</section>



</body>

</html>
